<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kayralrics.com | image</title>
    <meta
      name="description"
      content="kayralrics.com image studio: advanced image resizer, filter and edit workspace in a red-black premium UI."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">K</div>
          <div class="brand-copy">
            <span>kayralrics.com</span>
            <strong>image</strong>
          </div>
        </div>

        <nav class="tool-nav" aria-label="Araçlar">
          <button class="nav-item active" data-target="resizer-panel">
            <span class="nav-index">01</span>
            <span class="nav-text">
              <strong>Image Resizer</strong>
            </span>
          </button>

          <button class="nav-item" data-target="filter-panel">
            <span class="nav-index">02</span>
            <span class="nav-text">
              <strong>Image Filter</strong>
            </span>
          </button>

          <button class="nav-item" data-target="edit-panel">
            <span class="nav-index">03</span>
            <span class="nav-text">
              <strong>Image Edit</strong>
            </span>
          </button>
        </nav>

        <div class="sidebar-credit">kayralrics.net</div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <h1>Image Studio</h1>
        </header>

        <section class="tool-panels">
          <article class="panel active" id="resizer-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">tool 01</p>
                <h2>Image Resizer</h2>
              </div>
              <span class="tag">metadata-safe</span>
            </div>

            <div class="upload-card">
              <input type="file" id="resizer-file" accept=".png,.jpg,.jpeg,.webp,.bmp,.gif,.tif,.tiff,.avif,image/png,image/jpeg,image/webp,image/bmp,image/gif,image/tiff,image/avif" hidden />
              <div class="dropzone" id="resizer-dropzone">
                <div class="dropzone-icon">↥</div>
                <p>Upload image</p>
                <button type="button" class="accent-button">choose file</button>
              </div>
            </div>

            <div class="settings-grid">
              <div class="setting-block">
                <label>
                  Width
                  <input type="number" id="resize-width" value="1600" min="1" />
                </label>
              </div>
              <div class="setting-block">
                <label>
                  Height
                  <input type="number" id="resize-height" value="900" min="1" />
                </label>
              </div>
              <div class="setting-block">
                <label>
                  Quality
                  <input type="range" id="resize-quality" min="0.1" max="1" step="0.05" value="0.92" />
                </label>
              </div>
              <div class="setting-block toggle-box">
                <span>Remove metadata</span>
                <input type="checkbox" id="remove-metadata" checked />
              </div>
            </div>

            <div class="format-row">
              <label class="format-box">
                <span>Output format</span>
                <select id="resizer-format">
                  <option value="image/png">PNG</option>
                  <option value="image/jpeg">JPG</option>
                  <option value="image/webp">WEBP</option>
                </select>
              </label>
            </div>

            <div class="preset-row">
              <button class="size-preset active" data-width="1600" data-height="900">1600×900</button>
              <button class="size-preset" data-width="1920" data-height="1080">1920×1080</button>
              <button class="size-preset" data-width="1200" data-height="1200">1200×1200</button>
              <button class="size-preset" data-width="1024" data-height="768">1024×768</button>
            </div>

            <div class="preview-shell">
              <canvas id="resizer-canvas" width="1000" height="700"></canvas>
            </div>

            <div class="action-row">
              <button type="button" class="secondary-button" id="resize-apply">apply resize</button>
              <button type="button" class="accent-button" id="resize-download">download image</button>
            </div>
          </article>

          <article class="panel" id="filter-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">tool 02</p>
                <h2>Image Filter</h2>
              </div>
              <span class="tag">cinematic</span>
            </div>

            <div class="upload-card compact">
              <input type="file" id="filter-file" accept=".png,.jpg,.jpeg,.webp,.bmp,.gif,.tif,.tiff,.avif,image/png,image/jpeg,image/webp,image/bmp,image/gif,image/tiff,image/avif" hidden />
              <div class="dropzone" id="filter-dropzone">
                <div class="dropzone-icon">✦</div>
                <p>Load image</p>
                <button type="button" class="accent-button">browse</button>
              </div>
            </div>

            <div class="filter-layout">
              <div class="preset-stack">
                <button class="preset active" data-preset="noir">Noir</button>
                <button class="preset" data-preset="ember">Ember</button>
                <button class="preset" data-preset="crimson">Crimson</button>
                <button class="preset" data-preset="vivid">Vivid</button>
                <button class="preset" data-preset="silver">Silver</button>
              </div>

              <div class="slider-stack">
                <label>
                  Brightness
                  <input type="range" id="brightness" min="0" max="200" value="100" />
                </label>
                <label>
                  Contrast
                  <input type="range" id="contrast" min="0" max="200" value="120" />
                </label>
                <label>
                  Saturation
                  <input type="range" id="saturate" min="0" max="200" value="120" />
                </label>
                <label>
                  Sepia
                  <input type="range" id="sepia" min="0" max="100" value="15" />
                </label>
                <label>
                  Blur
                  <input type="range" id="blur" min="0" max="10" step="0.5" value="0" />
                </label>
              </div>
            </div>

            <div class="preview-shell">
              <canvas id="filter-canvas" width="1000" height="700"></canvas>
            </div>

            <div class="format-row">
              <label class="format-box">
                <span>Output format</span>
                <select id="filter-format">
                  <option value="image/png">PNG</option>
                  <option value="image/jpeg">JPG</option>
                  <option value="image/webp">WEBP</option>
                </select>
              </label>
            </div>

            <div class="action-row">
              <button type="button" class="secondary-button" id="filter-reset">reset</button>
              <button type="button" class="accent-button" id="filter-download">download image</button>
            </div>
          </article>

          <article class="panel" id="edit-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">tool 03</p>
                <h2>Image Edit</h2>
              </div>
              <span class="tag">quick fix</span>
            </div>

            <div class="upload-card compact">
              <input type="file" id="edit-file" accept=".png,.jpg,.jpeg,.webp,.bmp,.gif,.tif,.tiff,.avif,image/png,image/jpeg,image/webp,image/bmp,image/gif,image/tiff,image/avif" hidden />
              <div class="dropzone" id="edit-dropzone">
                <div class="dropzone-icon">✧</div>
                <p>Upload to edit</p>
                <button type="button" class="accent-button">open image</button>
              </div>
            </div>

            <div class="edit-toolbar">
              <button class="edit-button" data-rotate="-90">rotate left</button>
              <button class="edit-button" data-rotate="90">rotate right</button>
              <button class="edit-button" data-flip="x">flip x</button>
              <button class="edit-button" data-flip="y">flip y</button>
            </div>

            <div class="slider-stack compact-stack">
              <label>
                Exposure
                <input type="range" id="exposure" min="0" max="200" value="100" />
              </label>
              <label>
                Warmth
                <input type="range" id="warmth" min="0" max="200" value="100" />
              </label>
            </div>

            <div class="preview-shell">
              <canvas id="edit-canvas" width="1000" height="700"></canvas>
            </div>

            <div class="format-row">
              <label class="format-box">
                <span>Output format</span>
                <select id="edit-format">
                  <option value="image/png">PNG</option>
                  <option value="image/jpeg">JPG</option>
                  <option value="image/webp">WEBP</option>
                </select>
              </label>
            </div>

            <div class="action-row">
              <button type="button" class="secondary-button" id="edit-reset">reset edit</button>
              <button type="button" class="accent-button" id="edit-download">download image</button>
            </div>
          </article>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
